plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.example.radioplayer'
    compileSdk = 34

    defaultConfig {
        applicationId = "io.b7.radioplayer"
        minSdk = 21
        targetSdk = 34
        versionCode = 14
        versionName = "0.1.14"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Media3 dependencies for radio streaming and metadata
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-session:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-common:1.2.1'
    implementation 'androidx.media3:media3-extractor:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Auto-increment versionCode on every local assemble/install/bundle build
def isBuildTask = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('assemble') || it.toLowerCase().contains('install') || it.toLowerCase().contains('bundle')
}
if (isBuildTask) {
    def buildFile = file('build.gradle')
    def content = buildFile.getText('UTF-8')
    def codeMatcher = (content =~ /(?m)^(\s*versionCode\s*=\s*)(\d+)$/)
    if (codeMatcher.find()) {
        int currentCode = Integer.parseInt(codeMatcher.group(2))
        int nextCode = currentCode + 1
        content = codeMatcher.replaceFirst("\$1" + nextCode)
        def nameMatcher = (content =~ /(?m)^(\s*versionName\s*=\s*)"[^"]*"$/)
        if (nameMatcher.find()) {
            content = nameMatcher.replaceFirst("\$1\"0.1." + nextCode + "\"")
        }
        buildFile.setText(content, 'UTF-8')
        android.defaultConfig.versionCode = nextCode
        android.defaultConfig.versionName = "0.1." + nextCode
    }
}